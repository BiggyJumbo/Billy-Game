<!DOCTYPE html>
<html lang="en">
<head>

<title>Billy</title>
<style>
:root{--bg:#090b17;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#wrap{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;touch-action:none}
#hud{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:2px 16px;pointer-events:none;text-shadow:0 0 12px rgba(120,200,255,.7)}

#hint{font-size:1.5rem;font-weight:900;opacity:.95;text-align:center;font-variant-numeric:tabular-nums}
#hint.low{color:#ff4040;text-shadow:0 0 16px #ff2020}

/* JOYSTICK CONTAINER FIX: pointer-events auto & touch-action none */
#joy{position:fixed;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;z-index:99;touch-action:none;pointer-events:auto;background:radial-gradient(circle,rgba(120,200,255,.14),rgba(120,200,255,.04));border:2px solid rgba(120,200,255,.6);box-shadow:0 0 22px rgba(80,180,255,.4),inset 0 0 18px rgba(80,180,255,.25)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfe6ff,#3b9bff 60%,#1a4fa0);box-shadow:0 0 18px #4cc9ff;pointer-events:none}
#fire{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:2px solid #ff7a7a;z-index:99;touch-action:none;pointer-events:auto;color:#fff;font-weight:900;letter-spacing:.08em;font-size:1rem;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e02020 60%,#8a0f0f);box-shadow:0 0 26px rgba(255,60,60,.7),0 6px 0 #6b0b0b;-webkit-text-fill-color:#fff}
#fire.on{transform:translateY(5px);box-shadow:0 0 40px rgba(255,90,90,.95),0 1px 0 #6b0b0b}
#dash{position:fixed;right:124px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:2px solid #7ad8ff;background:radial-gradient(circle at 35% 30%,#bfe6ff,#2f8fff 65%,#123a94);color:#fff;font-size:1.6rem;font-weight:900;z-index:99;touch-action:none;pointer-events:auto;box-shadow:0 0 20px rgba(80,180,255,.7);-webkit-text-fill-color:#fff}
#dash:active{transform:scale(.92)}

#start{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;box-sizing:border-box;background:radial-gradient(circle at 50% 40%,rgba(40,20,80,.93),rgba(5,6,15,.97));text-align:center;pointer-events:auto}
#start.on{display:flex}
#stitle{font-size:2.4rem;font-weight:900;letter-spacing:.06em;color:#ff4d4d;text-shadow:0 0 28px #ff2020}
#how{max-width:320px;font-size:.95rem;line-height:1.55;opacity:.92}
#how b{color:#ffd23f}
#go{margin-top:8px;padding:16px 46px;border:0;border-radius:16px;font-size:1.3rem;font-weight:900;color:#fff;background:linear-gradient(#ff5a5a,#c01818);box-shadow:0 0 28px rgba(255,60,60,.8);-webkit-text-fill-color:#fff;animation:sp 1.4s infinite;cursor:pointer;pointer-events:auto}
#end{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,6,15,.82);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);pointer-events:auto}
#end.on{display:flex;animation:fi .5s ease-out}
@keyframes fi{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:none}}
#etitle{font-size:2.2rem;font-weight:900;color:#ffd23f;text-shadow:0 0 24px #ffd23f;text-align:center}
#elist{display:flex;flex-direction:column;gap:6px;min-width:230px}
.er{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-weight:700}
.er.me{background:rgba(255,210,63,.2);outline:1px solid #ffd23f}
.er .dt{width:14px;height:14px;border-radius:50%}
.er b{margin-left:auto}
.er em{font-style:normal;font-size:.75rem;opacity:.8}
#again{margin-top:10px;padding:14px 34px;border:0;border-radius:14px;font-size:1.1rem;font-weight:900;color:#fff;background:linear-gradient(#ff5a5a,#c01818);box-shadow:0 0 24px rgba(255,60,60,.7);-webkit-text-fill-color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="hud">
<div class="side"><small id="lv">YOU · LV 0</small><b id="s1">0</b></div>
<div id="hint">1:00</div>
<div class="side"><small>KILLS</small><b id="s0">0</b></div>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="joy"><div id="knob"></div></div>
<button id="dash">»</button>
<div id="start" class="on"><div id="stitle">BILLY</div><div id="how">Free-for-all! Score the most points in <b>60 seconds</b>.<br><br><b>Move:</b> joystick (or WASD)<br><b>Fire:</b> hold FIRE (or Space)<br><b>Dash:</b> » button (or Shift) to dodge<br><br>Grab glowing powerups. Hits and kills level you up!</div><button id="go">START</button></div>
<div id="end"><div id="etitle"></div><div id="elist"></div><button id="again">PLAY AGAIN</button></div>
<button id="fire">FIRE</button>

<script>
var $=function(i){return document.getElementById(i)};
var cv=$('cv'),cx=cv.getContext('2d'),hud=$('hud'),wrap=$('wrap');
var W,H,WW=0,WH=0,R=17,dpr=1,yHud=40,mt=0,mb=0,obs=[],stars=[],cam={x:0,y:0};
var cols={red:{l:'#ff7a7a',c:'#ff3030',d:'#8a0f0f'},green:{l:'#7dffa0',c:'#22d05a',d:'#0b5f2a'},blue:{l:'#8ab8ff',c:'#3b7bff',d:'#10338a'},purple:{l:'#d9a6ff',c:'#a24bff',d:'#451490'},pink:{l:'#ffa6e8',c:'#ff4fd8',d:'#8a1a73'},cyan:{l:'#9ef6ff',c:'#19d3f0',d:'#0a6a7a'},yellow:{l:'#fff3a0',c:'#ffd23f',d:'#8a6a00'},orange:{l:'#ffc08a',c:'#ff8a1f',d:'#8a3a00'}};
function rand(a,b){return a+Math.random()*(b-a);}
function rgba(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function mk(team,name){return{team:team,k:cols[name],hp:3,dead:false,rs:0,x:0,y:0,vx:0,vy:0,tx:0,ty:0,nt:0,ns:0,fl:0,rg:0,sh:0,rp:0,tr:0,bo:0,kx:0,ky:0,ph:rand(0,6),born:0,face:-1.5708,sp:name==='red'?55:85,pl:name==='red'};}
var B=[mk(1,'red'),mk(2,'purple'),mk(3,'pink'),mk(0,'green'),mk(4,'blue'),mk(5,'cyan'),mk(6,'yellow'),mk(7,'orange')];
var pickups=[],nextPick=0,banners=[],streak=0,streakT=0,holdFire=false,dmg=0,bullets=[],parts=[],texts=[],waves=[],rockets=[],score=[0,0,0,0,0,0,0,0],kills=0,combo=0,lastHitT=0,lvl=0,gameT=60,over=true,lastTl=-1,dashCd=0,shake=0,lastCool=0,nukes=3,nkRegen=0,rkReady=0,nukeAt=0,flashA=0,keys={},ts=1,zoom=1,hitstop=0,fx=null,joy={x:0,y:0,id:-1};
var PU={heal:{e:'❤',c:'#ff4d6d',n:'HEAL'},shield:{e:'🛡',c:'#4cc9ff',n:'SHIELD'},rapid:{e:'⚡',c:'#ffd23f',n:'RAPID FIRE'},triple:{e:'✦',c:'#c77dff',n:'TRIPLE SHOT'},boost:{e:'»',c:'#51cf66',n:'TURBO'}};
var PK=Object.keys(PU);
function zone(t){return{y0:R+10,y1:WH-R-10};}
function pushOut(b){obs.forEach(function(o){var qx=Math.max(o.x,Math.min(b.x,o.x+o.w)),qy=Math.max(o.y,Math.min(b.y,o.y+o.h)),dx=b.x-qx,dy=b.y-qy,d=Math.hypot(dx,dy);if(d<R){if(d>.001){b.x+=dx/d*(R-d);b.y+=dy/d*(R-d);}else b.y-=R;}});}
function place(b){
var z=zone(b.team),bx=0,by=0,bd=-1;
for(var i=0;i<8;i++){var x=rand(R+10,WW-R-10),y=rand(z.y0,z.y1),md=1e9;
B.forEach(function(o){if(o!==b&&!o.dead&&o.x)md=Math.min(md,Math.hypot(o.x-x,o.y-y));});
if(md>bd){bd=md;bx=x;by=y;}}
b.x=bx;b.y=by;pushOut(b);b.tx=b.x;b.ty=b.y;b.vx=b.vy=0;b.born=performance.now();
}
function buildWorld(){
mt=WH/2-12;mb=WH/2+12;obs=[];
var s=7;function sr(){s=(s*16807)%2147483647;return s/2147483647;}
for(var i=0;i<34;i++){var vert=sr()<.35,w=vert?24+sr()*14:70+sr()*80,h=vert?70+sr()*80:22+sr()*20;obs.push({x:60+sr()*(WW-w-120),y:60+sr()*(WH-h-120),w:w,h:h,c:i%2});}
}
function snap(){var p=B[0];cam.x=Math.max(0,Math.min(WW-W,p.x-W/2));cam.y=Math.max(0,Math.min(WH-H,p.y-H/2));}
function resize(){
dpr=window.devicePixelRatio||1;W=wrap.clientWidth||innerWidth;H=wrap.clientHeight||innerHeight;
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
yHud=hud.getBoundingClientRect().bottom;
var nw=Math.max(1500,W*3.8),nh=Math.max(2600,H*3.6);
if(nw!==WW||nh!==WH){WW=nw;WH=nh;buildWorld();B.forEach(place);snap();}
stars=[];for(var i=0;i<60;i++)stars.push({x:rand(0,W),y:rand(0,H),z:rand(.3,1)});
}
/* audio */
var ac=null;
function A(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}catch(e){return null;}}
function tone(f0,f1,d,type,v){var a=A();if(!a)return;try{var t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,f0,f1,v){var a=A();if(!a)return;try{var t=a.currentTime,n=Math.floor(a.sampleRate*d),bf=a.createBuffer(1,n,a.sampleRate),c=bf.getChannelData(0);for(var i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);var s=a.createBufferSource();s.buffer=bf;var f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);var g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(t);}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function vis(x,y){return x>cam.x-60&&x<cam.x+W+60&&y>cam.y-60&&y<cam.y+H+60;}
/* glow sprites */
var gl={};
function spr(c){if(gl[c])return gl[c];var o=document.createElement('canvas');o.width=o.height=64;var x=o.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,rgba(c,1));g.addColorStop(.4,rgba(c,.45));g.addColorStop(1,rgba(c,0));x.fillStyle=g;x.fillRect(0,0,64,64);return gl[c]=o;}
function glow(x,y,r,c,a){cx.globalAlpha=a;cx.drawImage(spr(c),x-r,y-r,r*2,r*2);}
/* fx helpers */
function burst(x,y,c,n,sp){for(var i=0;i<n;i++){var a=rand(0,6.283),s=rand(sp*.15,sp),l=i%3;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,max:rand(.3,.8),c:c,s:l?rand(1.2,2.6):rand(7,15),k:l?'l':'g'});}}
function smoke(x,y,s){parts.push({x:x,y:y,vx:rand(-15,15),vy:rand(-15,15),age:0,max:rand(.6,1.1),s:s,c:'#aaaaaa',k:'m'});}
function ring(x,y,max,c,dur,w){waves.push({x:x,y:y,max:max,t:0,dur:dur,c:c,w:w||4});}
function say(x,y,t,c,sz,life){texts.push({x:x,y:y,t:t,c:c,sz:sz,age:0,life:life});}
function banner(t,c){banners.push({t:t,c:c,age:0,life:1.6});}
function foes(team){return B.filter(function(b){return b.team!==team&&!b.dead;});}
function nearest(b,list){var best=1e9,t=null;list.forEach(function(o){var d=Math.hypot(o.x-b.x,o.y-b.y);if(d<best){best=d;t=o;}});return t?{t:t,d:best}:null;}
function fire(b,tx,ty,j,loud){
var a=Math.atan2(ty-b.y,tx-b.x)+rand(-j,j),ca=Math.cos(a),sa=Math.sin(a);
var bs=720*(b.pl?1+.04*lvl:1),bg=b.pl&&lvl>=3,dm=b.pl&&lvl>=6;
(b.tr>0?[-.24,0,.24]:[0]).forEach(function(o){var a2=a+o;bullets.push({x:b.x+Math.cos(a2)*R,y:b.y+Math.sin(a2)*R,vx:Math.cos(a2)*bs,vy:Math.sin(a2)*bs,team:b.team,c:b.k.c,tr:[],life:1.5,big:bg,dm:dm});});
if(b.pl)shake=Math.max(shake,.05);
b.kx-=ca*5;b.ky-=sa*5;
if(vis(b.x,b.y)){parts.push({x:b.x+ca*(R+5),y:b.y+sa*(R+5),vx:0,vy:0,age:0,max:.12,c:'#ffffff',s:loud?28:18,k:'g'});burst(b.x+ca*R,b.y+sa*R,b.k.l,loud?5:3,150);tone(loud?900:700,loud?300:250,.12,'square',loud?.06:.02);}
}
function hit(b,by){
if(b.sh>0){b.fl=.15;ring(b.x,b.y,R*2.4,'#4cc9ff',.35,4);burst(b.x,b.y,'#4cc9ff',10,200);say(b.x,b.y-R,'BLOCKED','#4cc9ff',13,.6);if(vis(b.x,b.y))tone(700,1100,.1,'triangle',.1);return;}
var v=vis(b.x,b.y);
b.hp--;b.rg=0;b.fl=.18;score[by]++;if(b.pl){dmg=.8;shake=Math.max(shake,.35);vib(60);}
if(by===1){var tn2=performance.now();combo=(tn2-lastHitT<1500)?combo+1:1;lastHitT=tn2;tone(500+combo*70,900+combo*90,.09,'triangle',.14);if(combo>=3)say(b.x,b.y-R-16,'x'+combo,'#ffd23f',16+Math.min(combo,10),.8);}
burst(b.x,b.y,b.k.l,14,240);ring(b.x,b.y,R*2.4,b.k.l,.3,3);
say(b.x+rand(-8,8),b.y-R,'-1','#ffffff',14,.7);
if(v)tone(220,80,.15,'sawtooth',.1);b.kx+=rand(-6,6);
if(b.hp<=0){
b.dead=true;b.rs=performance.now()+5000;score[by]+=5;b.sh=b.rp=b.tr=b.bo=0;
if(by===1){kills++;var tn=performance.now();streak=(tn-streakT<2500)?streak+1:1;streakT=tn;if(streak===2)banner('DOUBLE KILL','#ffd23f');else if(streak===3)banner('TRIPLE KILL','#ff9a2a');else if(streak>=4)banner('MEGA KILL','#ff3b3b');}
burst(b.x,b.y,b.k.c,60,400);
if(by===1){flashA=Math.max(flashA,.12);for(var oi=0;oi<10;oi++){var oa=rand(0,6.283),os=rand(120,320);parts.push({x:b.x,y:b.y,vx:Math.cos(oa)*os,vy:Math.sin(oa)*os,age:0,max:1.8,c:'#ffd23f',s:8,k:'o'});}say(b.x,b.y+R,'+5','#ffd23f',22,1.1);}
for(var i=0;i<16;i++){var a=rand(0,6.283),s=rand(80,300);parts.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,max:rand(.7,1.3),c:b.k.c,s:rand(3,7),k:'q',r:rand(0,6),vr:rand(-9,9)});}
ring(b.x,b.y,R*6,b.k.c,.55,6);ring(b.x,b.y,R*3.5,'#ffffff',.35,3);
if(v){shake=Math.max(shake,.6);zoom=Math.max(zoom,1.07);hitstop=.07;ts=.35;}
say(b.x,b.y-R,'Billy!',b.k.l,30,1.2);
tone(130,24,.9,'sine',v?.5:.12);noise(.6,2500,120,v?.35:.08);if(b.pl)vib(200);
}
}
function explode(x,y){
burst(x,y,'#ffb347',40,360);for(var i=0;i<8;i++)smoke(x+rand(-10,10),y+rand(-10,10),rand(7,12));
ring(x,y,85,'#ff9a2a',.4,6);if(vis(x,y)){shake=Math.max(shake,.45);zoom=Math.max(zoom,1.03);}
tone(150,30,.5,'sawtooth',.3);noise(.5,2000,100,.3);
foes(1).forEach(function(f){if(Math.hypot(f.x-x,f.y-y)<85){hit(f,1);if(!f.dead)hit(f,1);}});
}
function shootRed(){
A();var r=B[0],now=performance.now();if(over||r.dead||now-lastCool<(r.rp>0?85:Math.max(110,230*(1-.05*lvl))))return;lastCool=now;
var n=nearest(r,foes(1)),tx=r.x+Math.cos(r.face)*200,ty=r.y+Math.sin(r.face)*200;
if(n&&n.d<950){tx=n.t.x;ty=n.t.y;}
fire(r,tx,ty,0,true);r.fl=.08;
}
function launchRocket(){
A();var r=B[0],now=performance.now();if(r.dead||now<rkReady)return;rkReady=now+3000*(1-.04*lvl);
var n=nearest(r,foes(1)),a=n?Math.atan2(n.t.y-r.y,n.t.x-r.x):r.face;
rockets.push({x:r.x,y:r.y,a:a,life:5});
burst(r.x,r.y,'#ffb347',16,240);r.ky+=8;shake=Math.max(shake,.2);
tone(200,700,.5,'sawtooth',.07);noise(.4,3000,300,.15);
}
function launchNuke(){
A();var now=performance.now();if(nukes<1||nukeAt)return;nukes--;nukeAt=now+1800;
tone(60,420,1.8,'sawtooth',.09);
[0,450,900,1350].forEach(function(d){setTimeout(function(){tone(500,900,.4,'square',.05);},d);});
}
function detonate(){
flashA=1.5;shake=1.4;hitstop=.14;ts=.18;zoom=1.2;fx={t:0};banner('NUKED','#ffd23f');
var cxw=cam.x+W/2,cyw=cam.y+H/2;
ring(cxw,cyw,W*1.5,'#ffd23f',1.3,14);ring(cxw,cyw,W*1.2,'#ffffff',1,9);ring(cxw,cyw,W*.9,'#ff6a1a',.8,7);
for(var i=0;i<140;i++)parts.push({x:cam.x+rand(0,W),y:cam.y+rand(0,H),vx:rand(-60,60),vy:rand(-260,-40),age:0,max:rand(.8,2),c:i%2?'#ff9a2a':'#ffd23f',s:rand(8,20),k:'g'});
tone(160,20,2,'sine',.9);tone(500,30,1.4,'sawtooth',.2);noise(1.8,3500,60,.6);
bullets=bullets.filter(function(u){return u.team===1;});
foes(1).forEach(function(f){f.sh=0;while(!f.dead)hit(f,1);});
vib([300,80,500]);
}
function levelUp(l){
var p=B[0];banner('LEVEL '+l,'#7dffa0');
ring(p.x,p.y,R*8,'#7dffa0',.8,8);ring(p.x,p.y,R*5,'#ffffff',.5,4);burst(p.x,p.y,'#7dffa0',50,420);
say(p.x,p.y-R-30,'STATS UP!','#7dffa0',17,1.6);shake=Math.max(shake,.5);zoom=Math.max(zoom,1.06);flashA=Math.max(flashA,.25);
[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,f*1.01,.25,'triangle',.12);},i*90);});
vib([60,40,100]);
}
function spawnPick(now){
if(pickups.length>=7)return;
var near=Math.random()<.55,team=near?1:(Math.random()<.5?0:1),z=zone(team),k=PK[Math.floor(Math.random()*PK.length)];

function drawBanners(){

cx.fillStyle=r.b.dead?'rgba(255,255,255,.4)':'#fff';cx.fillText((i===0?'★ ':(i+1)+' ')+r.s,x+16,yy);
});

function drawXP(){var p=lvl>=10?1:(score[1]%12)/12;cx.fillStyle='rgba(255,255,255,.12)';cx.fillRect(0,yHud,W,3);var g2=cx.createLinearGradient(0,0,W,0);g2.addColorStop(0,'#3ddc5a');g2.addColorStop(1,'#a8ff7a');cx.fillStyle=g2;cx.fillRect(0,yHud,W*p,3);cx.globalCompositeOperation='lighter';glow(W*p,yHud+1,10,'#7dffa0',.8);cx.globalCompositeOperation='source-over';cx.globalAlpha=1;}
function draw(now){
cx.setTransform(dpr,0,0,dpr,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
drawSky(now);
var sx=shake?(Math.random()-.5)*shake*26:0,sy=shake?(Math.random()-.5)*shake*26:0;

parts.forEach(function(p){var t=1-p.age/p.max;
if(p.k==='m'){cx.globalAlpha=t*.4;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s*(1+(1-t)*2.5),0,6.283);cx.fill();}
else if(p.k==='q'){cx.globalAlpha=Math.min(1,t*2);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cx.restore();}});

cx.globalCompositeOperation='lighter';
bullets.forEach(function(u){for(var i=0;i<u.tr.length;i++){var q=u.tr[i],f=(i+1)/u.tr.length;glow(q[0],q[1],3+7*f,u.c,.5*f);}glow(u.x,u.y,14+(u.big?5:0),u.c,.9);glow(u.x,u.y,5,'#ffffff',1);});
rockets.forEach(function(k){glow(k.x,k.y,22,'#ff8a1f',.8);});
parts.forEach(function(p){var t=1-p.age/p.max;
if(p.k==='o'){glow(p.x,p.y,11,p.c,.9);glow(p.x,p.y,4,'#ffffff',1);}else if(p.k==='g')glow(p.x,p.y,p.s*(.4+t),p.c,Math.min(1,t*1.6));
else if(p.k==='e')glow(p.x,p.y,p.s,p.c,.4*Math.sin(Math.PI*(1-t)));
else if(p.k==='l'){cx.globalAlpha=t;cx.strokeStyle=p.c;cx.lineWidth=p.s*t+.5;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);cx.stroke();}});
waves.forEach(function(w){var t=w.t/w.dur;cx.globalAlpha=1-t;cx.strokeStyle=w.c;cx.lineWidth=w.w*(1-t)+1;cx.beginPath();cx.arc(w.x,w.y,w.max*(1-Math.pow(1-t,3)),0,6.283);cx.stroke();});
cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
rockets.forEach(function(k){cx.save();cx.translate(k.x,k.y);cx.rotate(k.a);cx.fillStyle='#ffb347';cx.beginPath();cx.moveTo(-7,0);cx.lineTo(-15,-4);cx.lineTo(-15,4);cx.fill();cx.fillStyle='#f1f1f5';cx.beginPath();cx.moveTo(11,0);cx.lineTo(-7,-4.5);cx.lineTo(-7,4.5);cx.closePath();cx.fill();cx.fillStyle='#ff4d4d';cx.fillRect(-3,-4.5,3.5,9);cx.restore();});

/* TOUCH EVENT LISTENER RE-WRITE */
var joyEl=$('joy'),knob=$('knob'),fireEl=$('fire');

function tStart(e){
  e.preventDefault();
  A();
  joy.active=true;
  joy.id=e.touches[0].identifier;
  tMove(e);
}
function tMove(e){
  if(!joy.active)return;
  e.preventDefault();
  for(var i=0;i<e.touches.length;i++){
    var t=e.touches[i];
    if(t.identifier===joy.id){
      var r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      var dx=t.clientX-cx,dy=t.clientY-cy,maxR=r.width/2-10,dist=Math.hypot(dx,dy);
      var k=dist>maxR?maxR/dist:1;dx*=k;dy*=k;
      var jm=Math.hypot(dx,dy)/maxR,jc=jm<.1?0:Math.min(1,(jm-.1)/.8);
      joy.x=jm?(dx/maxR/jm)*jc:0;joy.y=jm?(dy/maxR/jm)*jc:0;
      knob.style.transform='translate('+dx+'px,'+dy+'px)';
      break;
    }
  }
}
function tEnd(e){
  var found=false;
  for(var i=0;i<e.touches.length;i++){
    if(e.touches[i].identifier===joy.id)found=true;
  }
  if(!found){
    joy.active=false;joy.id=-1;joy.x=0;joy.y=0;
    knob.style.transform='';
  }
}

/* Pointer fallback */
joyEl.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;e.preventDefault();A();joy.active=true;var r=joyEl.getBoundingClientRect(),cx2=r.left+r.width/2,cy2=r.top+r.height/2;var dx=e.clientX-cx2,dy=e.clientY-cy2,maxR=r.width/2-10,d=Math.hypot(dx,dy);var k=d>maxR?maxR/d:1;dx*=k;dy*=k;var jm=Math.hypot(dx,dy)/maxR,jc=jm<.1?0:Math.min(1,(jm-.1)/.8);joy.x=jm?(dx/maxR/jm)*jc:0;joy.y=jm?(dy/maxR/jm)*jc:0;knob.style.transform='translate('+dx+'px,'+dy+'px)';});
window.addEventListener('pointermove',function(e){if(!joy.active||e.pointerType!=='mouse')return;e.preventDefault();var r=joyEl.getBoundingClientRect(),cx2=r.left+r.width/2,cy2=r.top+r.height/2;var dx=e.clientX-cx2,dy=e.clientY-cy2,maxR=r.width/2-10,d=Math.hypot(dx,dy);var k=d>maxR?maxR/d:1;dx*=k;dy*=k;var jm=Math.hypot(dx,dy)/maxR,jc=jm<.1?0:Math.min(1,(jm-.1)/.8);joy.x=jm?(dx/maxR/jm)*jc:0;joy.y=jm?(dy/maxR/jm)*jc:0;knob.style.transform='translate('+dx+'px,'+dy+'px)';});
window.addEventListener('pointerup',function(e){if(e.pointerType==='mouse'){joy.active=false;joy.x=0;joy.y=0;knob.style.transform='';}});

/* Core mobile touch events */
joyEl.addEventListener('touchstart',tStart,{passive:false});
joyEl.addEventListener('touchmove',tMove,{passive:false});
window.addEventListener('touchend',tEnd,{passive:false});
window.addEventListener('touchcancel',tEnd,{passive:false});

function fDown(e){e.preventDefault();A();holdFire=true;fireEl.classList.add('on');shootRed();}
function fUp(e){holdFire=false;fireEl.classList.remove('on');}
fireEl.addEventListener('touchstart',fDown,{passive:false});
fireEl.addEventListener('touchend',fUp,{passive:false});
fireEl.addEventListener('touchcancel',fUp,{passive:false});
fireEl.addEventListener('mousedown',fDown);
window.addEventListener('mouseup',fUp);

document.addEventListener('keydown',function(e){var k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(k==='Shift'||k==='e')dash();else if(k===' '){e.preventDefault();shootRed();}});
document.addEventListener('keyup',function(e){var k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
$('again').addEventListener('click',newGame);
$('go').addEventListener('click',function(){A();$('start').classList.remove('on');newGame();});
$('dash').addEventListener('pointerdown',function(e){e.preventDefault();dash();});
window.addEventListener('resize',resize);
try{new ResizeObserver(resize).observe(wrap);}catch(e){}
resize();
requestAnimationFrame(frame);
