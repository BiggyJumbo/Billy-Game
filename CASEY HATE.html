<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASEY HATE</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#220040;overflow:hidden;touch-action:none}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#lo{image-rendering:pixelated;filter:saturate(1.6) contrast(1.15)}
</style></head><body>
<canvas id="lo"></canvas><canvas id="hi"></canvas>
<script>
const lo=document.getElementById('lo'),hi=document.getElementById('hi'),g=lo.getContext('2d'),h=hi.getContext('2d');
const RB=['#ff2020','#ff9a00','#ffee00','#20e820','#20a0ff','#8030ff','#ff40d0'];
const SAY=['Oh, I’m so big','Oh, I’m so juicy','Oh, I’m so gassy'];
const H0=220;let W0,S,SW,SH;
function rs(){SW=hi.width=innerWidth;SH=hi.height=innerHeight;S=SH/H0;W0=Math.max(120,Math.min(400,Math.round(SW/S)));lo.width=W0;lo.height=H0;S=SW/W0}
rs();addEventListener('resize',rs);
let state='title',t=0,score=0,lives=3,kills=0,best=0,inv=0,P,en,hv,fx,pop,tip,tgt,tspd=0,spawn;
const conf=Array.from({length:140},()=>({x:Math.random()*400,y:Math.random()*H0,c:RB[Math.random()*7|0],s:1+(Math.random()*3|0),v:8+Math.random()*30}));
function reset(){P={x:W0/2,y:H0-34};en=[];hv=[];fx=[];pop=[];score=0;lives=3;kills=0;inv=0;spawn=0;tgt={x:W0/2,y:H0-90};tip={x:W0/2,y:H0-90}}
reset();
function mv(e){tgt={x:e.clientX/S,y:e.clientY/S}}
addEventListener('pointermove',mv);
addEventListener('pointerdown',e=>{mv(e);if(state!=='play'){reset();state='play';mv(e)}});
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1;let u=((px-ax)*dx+(py-ay)*dy)/l;u=Math.max(0,Math.min(1,u));return Math.hypot(px-ax-u*dx,py-ay-u*dy)}
function bg(){const gr=g.createLinearGradient(0,0,0,H0);gr.addColorStop(0,'#5a20e0');gr.addColorStop(.6,'#ff60c0');gr.addColorStop(1,'#ffd040');g.fillStyle=gr;g.fillRect(0,0,W0,H0);
g.lineWidth=5;for(let i=0;i<7;i++){g.strokeStyle=RB[i];g.beginPath();g.arc(W0/2,H0+30,W0*.55-i*5+Math.sin(t*2)*2,Math.PI,0);g.stroke()}
g.fillStyle='#fff';for(let i=0;i<3;i++){const x=((t*9*(i+1)+i*140)%(W0+80))-40,y=25+i*55;g.fillRect(x|0,y,34,9);g.fillRect(x+6|0,y-6,20,7);g.fillRect(x+22|0,y-3,22,8)}
conf.forEach(c=>{c.y+=c.v/60;if(c.y>H0){c.y=-3;c.x=Math.random()*W0}g.fillStyle=c.c;g.fillRect(c.x|0,c.y|0,c.s,c.s)});
for(let i=0;i<30;i++){g.fillStyle=RB[Math.random()*7|0];g.fillRect(Math.random()*W0|0,Math.random()*H0|0,1,1)}}
function dog(){const x=P.x|0,y=P.y|0;if(inv>0&&Math.floor(t*20)%2)return;
g.fillStyle='#e0a050';g.fillRect(x-16,y-6,32,34);g.fillStyle='#c07830';g.fillRect(x-16,y+22,32,6);
g.fillStyle='#9030e0';g.fillRect(x-12,y-30,24,60);g.fillStyle='#c060ff';g.fillRect(x-12,y-30,6,60);
g.fillStyle='#fff';g.fillRect(x-9,y-16,7,7);g.fillRect(x+3,y-16,7,7);g.fillStyle='#000';g.fillRect(x-6+(Math.sin(t*4)*2|0),y-14,3,3);g.fillRect(x+6,y-14,3,3);
g.fillStyle='#ff7090';g.fillRect(x-4,y-9,9,11);g.fillStyle='#d04060';g.fillRect(x-4,y+1,9,2);
g.fillStyle='#000';g.fillRect(x-8,y+8,16,2);g.fillRect(x-9,y+6,2,2);g.fillRect(x+7,y+6,2,2);g.fillStyle='#f55';g.fillRect(x-2,y+10,5,3);
g.fillStyle='#e0a050';g.fillRect(x+12,y+2,6,6)}
function sword(){const hx=P.x+16,hy=P.y+4;let dx=tip.x-hx,dy=tip.y-hy,d=Math.hypot(dx,dy)||1;const L=Math.min(d,85);dx/=d;dy/=d;const ex=hx+dx*L,ey=hy+dy*L;
g.lineCap='butt';g.strokeStyle='#e8e8f8';g.lineWidth=4;g.beginPath();g.moveTo(hx+dx*8,hy+dy*8);g.lineTo(ex,ey);g.stroke();
g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(hx+dx*8,hy+dy*8);g.lineTo(ex,ey);g.stroke();
g.strokeStyle='#fc0';g.lineWidth=3;g.beginPath();g.moveTo(hx-dy*7+dx*8,hy+dx*7+dy*8);g.lineTo(hx+dy*7+dx*8,hy-dx*7+dy*8);g.stroke();
if(tspd>50&&state==='play'){g.fillStyle=RB[(t*30|0)%7];g.fillRect(ex-2|0,ey-2|0,5,5)}
return{hx,hy,ex,ey}}
function demon(e){const x=e.x|0,y=e.y|0,r=e.r;g.fillStyle='#a00000';
g.beginPath();g.moveTo(x-r*.7,y-r*.4);g.lineTo(x-r*.9,y-r*1.4);g.lineTo(x-r*.2,y-r*.8);g.moveTo(x+r*.7,y-r*.4);g.lineTo(x+r*.9,y-r*1.4);g.lineTo(x+r*.2,y-r*.8);g.fill();
g.fillStyle=e.fl>0?'#fff':'#e01818';g.beginPath();g.arc(x,y,r,0,7);g.fill();
g.fillStyle='#ffee00';g.fillRect(x-r*.5|0,y-r*.4|0,r*.3|0,r*.25|0);g.fillRect(x+r*.2|0,y-r*.4|0,r*.3|0,r*.25|0);
g.fillStyle='#000';g.fillRect(x-r*.4|0,y-r*.3|0,3,3);g.fillRect(x+r*.3|0,y-r*.3|0,3,3);
g.fillRect(x-r*.5|0,y+r*.5|0,r|0,2);g.fillStyle='#fff';for(let i=0;i<4;i++)g.fillRect(x-r*.45+i*r*.25|0,y+r*.5|0,2,3);
if(e.boss){g.fillStyle='#000';g.fillRect(x-r,y+r+3,r*2,4);g.fillStyle='#2f2';g.fillRect(x-r,y+r+3,r*2*e.hp/e.mhp,4)}}
function kill(e){e.dead=1;kills++;score+=e.boss?50:5;const m=Math.random()*3|0;pop.push({x:e.x,y:e.y,txt:SAY[m],life:1.6});
hv.push({x:e.x,y:e.y,r:e.r,vx:-40,vy:-30,a:0,va:-4,s:0,life:1},{x:e.x,y:e.y,r:e.r,vx:40,vy:-30,a:0,va:4,s:1,life:1});
for(let i=0;i<26;i++)fx.push({x:e.x,y:e.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:1,gas:m==2,c:m==2?'#80ff60':m==1?'#ffb030':RB[i%7]})}
function update(dt){t+=dt;
const ox=tip.x,oy=tip.y;tip.x+=(tgt.x-tip.x)*Math.min(1,14*dt);tip.y+=(tgt.y-tip.y)*Math.min(1,14*dt);
tspd+=((Math.hypot(tip.x-ox,tip.y-oy)/dt)-tspd)*.4;
if(state==='title'){P.x=W0/2+Math.sin(t*2)*30;return}
if(state!=='play')return;
P.x+=(Math.max(20,Math.min(W0-20,tgt.x))-P.x)*Math.min(1,6*dt);inv-=dt;
spawn-=dt;if(spawn<=0){spawn=Math.max(.4,1.1-score/500);const boss=kills>0&&kills%12===0&&!en.some(e=>e.boss);const r=boss?34:12+Math.random()*8;
en.push({x:r+Math.random()*(W0-2*r),y:-r*2,r,boss,hp:boss?10:1,mhp:10,vy:boss?14:22+Math.random()*20+score/20,ph:Math.random()*9,cd:0,fl:0});if(boss)kills++}
const sw=(()=>{const hx=P.x+16,hy=P.y+4;let dx=tip.x-hx,dy=tip.y-hy,d=Math.hypot(dx,dy)||1;const L=Math.min(d,85);return{hx,hy,ex:hx+dx/d*L,ey:hy+dy/d*L}})();
en.forEach(e=>{e.y+=e.vy*dt;e.x+=Math.sin(t*2+e.ph)*14*dt;e.cd-=dt;e.fl-=dt;
if(tspd>50&&e.cd<=0&&segD(e.x,e.y,sw.hx,sw.hy,sw.ex,sw.ey)<e.r+3){e.hp--;e.cd=.12;e.fl=.06;if(e.hp<=0&&!e.dead)kill(e)}
if(!e.dead&&inv<=0&&Math.hypot(P.x-e.x,P.y-e.y)<e.r+14){e.dead=1;lives--;inv=1.5;if(lives<=0){state='over';best=Math.max(best,score)}}});
en=en.filter(e=>!e.dead&&e.y<H0+60)}
function post(dt){hv.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=160*dt;a.a+=a.va*dt;a.life-=dt});hv=hv.filter(a=>a.life>0);
fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt+(f.gas?-10*dt:60*dt);f.life-=dt});fx=fx.filter(f=>f.life>0);
pop.forEach(p=>{p.y-=18*dt;p.life-=dt});pop=pop.filter(p=>p.life>0)}
function T(s,x,y,sz,c){h.font='bold '+sz+'px "Comic Sans MS","Chalkboard SE",cursive,sans-serif';h.textAlign='center';h.lineWidth=sz/5;h.lineJoin='round';h.strokeStyle='#000';h.strokeText(s,x,y);h.fillStyle=c;h.fillText(s,x,y)}
function draw(){bg();
en.forEach(demon);
hv.forEach(a=>{g.save();g.translate(a.x|0,a.y|0);g.rotate(a.a);g.fillStyle='#e01818';g.beginPath();g.arc(0,0,a.r,a.s?-Math.PI/2:Math.PI/2,a.s?Math.PI/2:Math.PI*1.5);g.fill();g.restore()});
fx.forEach(f=>{g.globalAlpha=Math.max(0,f.life);g.fillStyle=f.c;const s=f.gas?4+(1-f.life)*8:3;g.fillRect(f.x|0,f.y|0,s,s)});g.globalAlpha=1;
dog();sword();
if(state==='title'){const d={x:W0/2+Math.sin(t*1.3)*50,y:70+Math.sin(t*3)*5,r:30,fl:0};demon(d)}
h.clearRect(0,0,SW,SH);
en.forEach(e=>T('CASEY',e.x*S,(e.y+e.r*.15)*S+8,Math.min(e.r*S*.7,44),'#fff'));
pop.forEach(p=>{h.globalAlpha=Math.min(1,p.life);T(p.txt,Math.max(110,Math.min(SW-110,p.x*S)),p.y*S-20,Math.min(SW/13,26),'#ffff40');h.globalAlpha=1});
if(state==='title'){const sz=Math.min(SW/5,84),y=SH*.12;
'CASEY'.split('').forEach((c,i)=>T(c,SW/2+(i-2)*sz*.82,y+sz+Math.sin(t*5+i)*8,sz,RB[i]));
'HATE'.split('').forEach((c,i)=>T(c,SW/2+(i-1.5)*sz*.82,y+sz*2+Math.sin(t*5+i+2)*8,sz,RB[(i+3)%7]));
const f=Math.min(SW/22,20);T('(not actually hate. he’s just the demon',SW/2,SH*.5,f,'#fff');T('you gotta hate.)',SW/2,SH*.5+f*1.4,f,'#fff');
T('SWIPE TO SLICE CASEY',SW/2,SH*.62+Math.sin(t*8)*3,Math.min(SW/12,30),'#ffee00');T('tap to start',SW/2,SH*.67,f,'#fff')}
else{T('Score '+score,70,32,22,'#fff');T('♥'.repeat(Math.max(0,lives)),SW-50,34,26,'#ff3070')}
if(state==='over'){h.fillStyle='rgba(30,0,60,.6)';h.fillRect(0,0,SW,SH);
T('CASEY SURVIVED',SW/2,SH*.33,Math.min(SW/9,44),'#ffee00');T('Score '+score+'  Best '+best,SW/2,SH*.43,26,'#fff');
T('TAP TO SLICE AGAIN',SW/2,SH*.56+Math.sin(t*8)*3,Math.min(SW/12,30),RB[(t*6|0)%7])}}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000)||.016;last=n;update(dt);post(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
