<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billy</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        canvas {
            background-color: #55aa55;
            display: block;
            margin: 0 auto;
            image-rendering: pixelated; /* 8-bit blocky feel */
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            text-align: left;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: bold;
            color: red;
            text-shadow: 4px 4px 0 #000;
            display: none;
            cursor: pointer;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 4px solid white;
        }
    </style>
</head>
<body>
    <div id="ui">
        WAVE: <span id="waveDisplay">1</span><br>
        LEVEL: <span id="levelDisplay">1</span><br>
        KILLS: <span id="killDisplay">0</span>
    </div>
    <div id="gameover" onclick="location.reload()">
        GAME OVER<br>
        <span style="font-size:24px; color:white">Click to MOO again</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game State
        let wave = 1;
        let level = 1;
        let kills = 0;
        let gameOver = false;
        let bossSpawned = false;
        let spawnRate = 2000;
        let lastSpawn = 0;
        let keys = {};
        let mouse = { x: canvas.width/2, y: canvas.height/2 };

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mousedown', shoot);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        // Entities
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 40,
            speed: 5
        };

        const bullets = [];
        const enemies = [];
        const particles = [];

        function drawCow(x, y, size) {
            ctx.fillStyle = 'white';
            ctx.fillRect(x - size/2, y - size/2, size, size); // Body
            
            // Cow spots
            ctx.fillStyle = 'black';
            ctx.fillRect(x - size/2, y - size/4, size/3, size/3);
            ctx.fillRect(x, y + size/4, size/4, size/4);
            
            // Pink snout
            ctx.fillStyle = 'pink';
            ctx.fillRect(x + size/4, y - size/4, size/4, size/2);
            
            // Udders
            ctx.fillStyle = '#ff88cc';
            ctx.fillRect(x - size/4, y + size/2, size/2, size/4);
        }

        function drawFarmer(x, y, size) {
            ctx.fillStyle = '#8B4513'; // Brown overalls
            ctx.fillRect(x - size/2, y - size/2, size, size);
            
            // Stupid face
            ctx.fillStyle = '#ffccaa';
            ctx.fillRect(x - size/4, y - size/2 - size/4, size/2, size/2);
            
            // Eyes
            ctx.fillStyle = 'black';
            ctx.fillRect(x - size/4 + 4, y - size/2 - size/4 + 4, 4, 4);
            ctx.fillRect(x + size/4 - 8, y - size/2 - size/4 + 4, 4, 4);

            // Pitchfork
            ctx.fillStyle = '#aaa';
            ctx.fillRect(x + size/4, y - size/2, 4, size);
            ctx.fillRect(x + size/4 - 4, y - size/2 - 4, 12, 4); // Tines
        }

        function drawBoss(x, y, size) {
            ctx.fillStyle = '#5c4033'; // Dog body
            ctx.fillRect(x - size/2, y - size/2, size, size/1.5);
            
            // 3 Heads
            ctx.fillStyle = '#5c4033';
            let heads = [
                {hx: x - size/2 - 20, hy: y - size/2 - 40}, // Left
                {hx: x - 20, hy: y - size/2 - 50},          // Center
                {hx: x + size/2 - 20, hy: y - size/2 - 40}  // Right
            ];

            for (let h of heads) {
                ctx.fillRect(h.hx, h.hy, 40, 40); // Head box
                
                // Vampire Red Eyes
                ctx.fillStyle = 'red';
                ctx.fillRect(h.hx + 10, h.hy + 10, 5, 5);
                ctx.fillRect(h.hx + 25, h.hy + 10, 5, 5);
                
                // Vampire Teeth
                ctx.fillStyle = 'white';
                ctx.fillRect(h.hx + 10, h.hy + 30, 4, 10);
                ctx.fillRect(h.hx + 26, h.hy + 30, 4, 10);
                
                ctx.fillStyle = '#5c4033'; // reset for next head
            }

            // Vampire Claws
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.moveTo(x - size/2, y + size/1.5); 
            ctx.lineTo(x - size/2 - 15, y + size/1.5 + 25); 
            ctx.lineTo(x - size/2 + 15, y + size/1.5);
            
            ctx.moveTo(x + size/2, y + size/1.5); 
            ctx.lineTo(x + size/2 - 15, y + size/1.5 + 25); 
            ctx.lineTo(x + size/2 + 15, y + size/1.5);
            ctx.fill();
        }

        function shoot() {
            if (gameOver) return;
            const angle = Math.atan2(mouse.y - (player.y + player.size/2), mouse.x - player.x);
            
            // Multi-shot based on level
            let shots = Math.min(1 + Math.floor((level - 1) / 2), 5); 
            for(let i=0; i<shots; i++) {
                let spread = (i - (shots-1)/2) * 0.15;
                bullets.push({
                    x: player.x,
                    y: player.y + player.size/2, // Shoots from udders
                    vx: Math.cos(angle + spread) * 12,
                    vy: Math.sin(angle + spread) * 12,
                    size: 8
                });
            }
        }

        function spawnEnemy() {
            if (wave % 5 === 0 && !bossSpawned) {
                // Boss Wave
                enemies.push({
                    x: Math.random() > 0.5 ? -150 : canvas.width + 150,
                    y: Math.random() * canvas.height,
                    size: 150,
                    hp: 50 * wave,
                    maxHp: 50 * wave,
                    speed: 1.2 + (wave * 0.1),
                    isBoss: true
                });
                bossSpawned = true;
            } else if (wave % 5 !== 0) {
                // Normal Farmers
                let side = Math.floor(Math.random() * 4);
                let ex = 0, ey = 0;
                if(side === 0) { ex = Math.random() * canvas.width; ey = -50; }
                if(side === 1) { ex = canvas.width + 50; ey = Math.random() * canvas.height; }
                if(side === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 50; }
                if(side === 3) { ex = -50; ey = Math.random() * canvas.height; }

                enemies.push({
                    x: ex,
                    y: ey,
                    size: 36,
                    hp: 1 + wave,
                    speed: 2 + (wave * 0.15),
                    isBoss: false
                });
            }
        }

        function update(time) {
            if (gameOver) return;

            // Player Movement
            if ((keys['w'] || keys['arrowup']) && player.y > player.size/2) player.y -= player.speed;
            if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.size/2) player.y += player.speed;
            if ((keys['a'] || keys['arrowleft']) && player.x > player.size/2) player.x -= player.speed;
            if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.size/2) player.x += player.speed;

            // Spawning
            if (time - lastSpawn > spawnRate) {
                spawnEnemy();
                lastSpawn = time;
                spawnRate = Math.max(400, 2000 - (wave * 100)); // Gets faster
            }

            // Wave progression
            if(kills > wave * 15 && !bossSpawned) {
                wave++;
                document.getElementById('waveDisplay').innerText = wave;
            }

            // Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // Collision with player
                let dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < (player.size/2 + e.size/2 - 10)) {
                    gameOver = true;
                    document.getElementById('gameover').style.display = 'block';
                }

                // Collision with bullets (Milk)
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let bDist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (bDist < e.size/2 + b.size) {
                        e.hp--;
                        bullets.splice(j, 1);
                        
                        // Blood / damage particle effect
                        for(let k=0; k<4; k++) {
                            particles.push({
                                x: e.x, y: e.y,
                                vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                                life: 15
                            });
                        }

                        if (e.hp <= 0) {
                            enemies.splice(i, 1);
                            kills++;
                            document.getElementById('killDisplay').innerText = kills;
                            
                            // Level up every 10 kills
                            if (kills % 10 === 0) {
                                level++;
                                document.getElementById('levelDisplay').innerText = level;
                            }

                            if (e.isBoss) {
                                bossSpawned = false;
                                wave++;
                                document.getElementById('waveDisplay').innerText = wave;
                            }
                            break;
                        }
                    }
                }
            }

            // Particles update
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Particles
            ctx.fillStyle = 'red';
            for (let p of particles) {
                ctx.fillRect(p.x, p.y, 6, 6);
            }

            // Bullets (Milk)
            ctx.fillStyle = 'white';
            for (let b of bullets) {
                ctx.fillRect(b.x, b.y, b.size, b.size);
            }

            // Enemies
            for (let e of enemies) {
                if(e.isBoss) {
                    drawBoss(e.x, e.y, e.size);
                    // Boss HP bar
                    ctx.fillStyle = 'red';
                    ctx.fillRect(e.x - e.size/2, e.y - e.size/2 - 70, e.size, 10);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(e.x - e.size/2, e.y - e.size/2 - 70, e.size * (e.hp/e.maxHp), 10);
                } else {
                    drawFarmer(e.x, e.y, e.size);
                }
            }

            // Player
            if (!gameOver) {
                drawCow(player.x, player.y, player.size);
            }
        }

        function loop(time) {
            update(time);
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
